spec = "lexlean/project/1"
name = "wireshark-lexlean"
language = "1.2"
module_prefix = "Wireshark"
source_roots = ["src"]
entrypoints = ["src/Enterprise/AlertOperations.lex.tex", "src/Enterprise/CapturePipeline.lex.tex", "src/Enterprise/FileServerThreats.lex.tex", "src/Enterprise/Invariants.lex.tex", "src/Enterprise/Normalization.lex.tex", "src/Foundation/Arch.lex.tex", "src/Foundation/Qual.lex.tex", "src/Foundation/Sec.lex.tex", "src/Main.lex.tex", "src/Wireshark/Capture.lex.tex", "src/Wireshark/Dissector.lex.tex", "src/Wireshark/Filter.lex.tex", "src/Wireshark/Invariants.lex.tex", "src/Wireshark/PcapNg.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.2"

[[lexicon_source]]
package = "lexlean.std.bool"
kind = "builtin"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "language/prism.arch"

[[lexicon_source]]
package = "prism.qual"
kind = "path"
path = "language/prism.qual"

[[lexicon_source]]
package = "prism.sec"
kind = "path"
path = "language/prism.sec"

[[lexicon_source]]
package = "wireshark.titles"
kind = "path"
path = "language/wireshark.titles"

[limits]
max_file_bytes = 4194304
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 300000
